<style>
  html, body { margin: 0; padding: 0; overflow: hidden; }
  * { box-sizing: border-box; }
  /* Divi Marketplace featured image template size. Centered rather than the
     banner's left-mark layout: this one is read as a card in a product grid,
     where symmetry survives downscaling better than a wide split does. */
  .featured {
    width: 1426px;
    height: 796px;
    background: #EFE8DA;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Zilla Slab', serif;
    padding: 0 80px;
  }
  .badge { flex: none; margin-bottom: 38px; }
  .headline {
    font-family: 'Zilla Slab', serif;
    font-weight: 700;
    font-size: 84px;
    line-height: 1;
    color: #26313A;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  .subline {
    font-family: 'Zilla Slab', serif;
    font-weight: 600;
    font-size: 50px;
    line-height: 1;
    color: #A8402F;
    margin-top: 16px;
    white-space: nowrap;
  }
  .rule {
    width: 300px;
    height: 2px;
    background: #26313A;
    margin: 34px 0 26px;
  }
  .tagline {
    font-family: 'Zilla Slab', serif;
    font-weight: 500;
    font-size: 30px;
    line-height: 1.35;
    color: #26313A;
    text-align: center;
    max-width: 1000px;
  }
  .brand {
    margin-top: 40px;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.35em;
    color: #A8402F;
    display: flex;
    align-items: center;
    white-space: nowrap;
  }
  .diamond {
    width: 8px;
    height: 8px;
    background: #A8402F;
    transform: rotate(45deg);
    display: inline-block;
    margin: 0 14px;
    flex: none;
  }
  .diamond.first { margin-left: 0; }
  .diamond.last { margin-right: 0; }
</style>
